name: Run Scheduler Automation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Which automation task to run
        required: true
        default: schedule
        type: choice
        options:
          - schedule
          - leases:expire-overdue
          - reminders:send-rent

jobs:
  scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, xml, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "DB_CONNECTION=${{ secrets.DB_CONNECTION || 'mysql' }}"
            echo "DB_HOST=${{ secrets.DB_HOST }}"
            echo "DB_PORT=${{ secrets.DB_PORT }}"
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}"
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "AT_USERNAME=${{ secrets.AT_USERNAME || 'sandbox' }}"
            echo "AT_API_KEY=${{ secrets.AT_API_KEY || '' }}"
          } >> .env

      - name: Run automation task
        shell: bash
        run: |
          TASK="${{ github.event.inputs.task || 'schedule' }}"
          if [ "$TASK" = "schedule" ]; then
            php artisan schedule:run -vvv
          else
            php artisan "$TASK"
          fi

name: Restore Database Snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_file:
        description: Snapshot filename inside backup/db-snapshots/snapshots
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backup branch
        uses: actions/checkout@v4
        with:
          ref: backup/db-snapshots

      - name: Set up database client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Prepare environment
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=${{ secrets.DB_CONNECTION || 'mysql' }}"
            echo "DB_HOST=${{ secrets.DB_HOST }}"
            echo "DB_PORT=${{ secrets.DB_PORT }}"
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}"
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
          } >> .env

      - name: Restore snapshot
        shell: pwsh
        run: |
          ./scripts/Restore-DbBackup.ps1 -SnapshotPath "snapshots/${{ github.event.inputs.snapshot_file }}"
